[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "pandas", "psycopg[binary]", "pgvector", "sentence-transformers", "fastapi", "uvicorn[standard]", "ollama", "pypdf", "python-multipart", "streamlit", "openai"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]